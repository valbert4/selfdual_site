# Enumerator / invariant-space / cft-projection catalog for the dashboard.
# Single source of truth: the build step generates data/enumerators.json from
# this file, and the dashboard fetches that. Paths are base-relative (no leading
# slash) so the site works at a domain root or a project sub-path.
enumerators:
  - title: "Forced partition biweight"
    kind: "biweight"
    note: "Partition MacWilliams output used as a checksum."
    file: "downloads/enumerators/biweight_forced.json"
  - title: "Genus-2 biweight result"
    kind: "biweight"
    note: "Solver result for the genus-2 partition equations."
    file: "downloads/enumerators/biweight_genus2_result.json"
  - title: "Length-68 one-weight enumerator"
    kind: "one-weight"
    note: "Auxiliary length-68 weight enumerator data."
    file: "downloads/enumerators/weight_enum_W68.json"
  - title: "Length-68 child biweight"
    kind: "biweight"
    note: "Child biweight data from the length-68 branch."
    file: "downloads/enumerators/biweight_child68.json"
  - title: "Length-68 envelope 56 enumerator"
    kind: "one-weight"
    note: "Envelope enumerator for the induced length-56 object."
    file: "downloads/enumerators/envelope56_enumerator.json"
  - title: "Length-56 biweight family"
    kind: "biweight"
    note: "Large JSON family for length-56 residual biweights."
    file: "downloads/enumerators/biweight_n56_family.json"
  - title: "Length-56 biweight summary"
    kind: "biweight"
    note: "Summary of the length-56 biweight family."
    file: "downloads/enumerators/biweight_n56_summary.json"
  - title: "Length-56 global mixture"
    kind: "biweight"
    note: "Global mixture feasibility data."
    file: "downloads/enumerators/biweight_global_mixture.json"
  - title: "Length-56 row probes"
    kind: "biweight"
    note: "Row-probe data for the global mixture layer."
    file: "downloads/enumerators/biweight_global_mixture_row_probes.json"
  - title: "Length-40 biweight results"
    kind: "biweight"
    note: "Length-40 biweight calculation output."
    file: "downloads/enumerators/biweight_n40_results.json"
  - title: "Baby triweight"
    kind: "triweight"
    note: "Small triweight calculation used for local checks."
    file: "downloads/enumerators/baby_triweight.json"
  - title: "C1 D12sq genus-3 data"
    kind: "triweight"
    note: "Genus-3 / triweight enumerator output for the C1 branch."
    file: "downloads/enumerators/c1_d12sq_genus3.json"
  - title: "Golay genus-3 data"
    kind: "triweight"
    note: "Known-code genus-3 calculation for validation and comparison."
    file: "downloads/enumerators/golay_genus3.json"
  - title: "Triweight q-constraint"
    kind: "triweight"
    note: "Constraint data used by the triweight feedback layer."
    file: "downloads/enumerators/triweight_q_constraint.json"
  - title: "Anchored triweight pin"
    kind: "triweight"
    note: "Anchored SDP triweight pinning data."
    file: "downloads/enumerators/triweight_pin.json"
  - title: "Anchored coupled screen"
    kind: "triweight"
    note: "Prime-73 coupled triweight screen data."
    file: "downloads/enumerators/triweight_coupled_screen_73.json"
  - title: "Mode-1 triweight filter"
    kind: "triweight"
    note: "Mode-1 triweight filter output."
    file: "downloads/enumerators/triweight_mode1_filter.json"
  - title: "n=32 invariant-space nullbasis"
    kind: "genus-3 invariant space"
    note: "AGL/GL self-equation nullbasis over p=13 and p=17; nullity 9."
    file: "downloads/genus3-invariant-space-bundle.tar.gz"
  - title: "n=40 invariant-space nullbasis"
    kind: "genus-3 invariant space"
    note: "AGL columns and GL rows; nullity 16 over p=13 and p=17."
    file: "downloads/genus3/agl_n40_p13.nullbasis.json.gz"
  - title: "n=40 converted bases"
    kind: "genus-3 basis"
    note: "G48-coordinate basis files converted from the AGL nullbasis."
    file: "downloads/genus3/n40_basis_p13.json.gz"
  - title: "d_n+ atoms at n=40 and n=48"
    kind: "closed-form genus-3 atom"
    note: "Closed-form d_n+ genus-3 atom data over p=13 and p=17."
    file: "downloads/genus3/n48_dnplus_p13.json.gz"
  - title: "n=72 modular candidate spaces"
    kind: "genus-3 candidate space"
    note: "AGL mindist [72,36,16] candidate nullspaces across small and large primes."
    file: "downloads/genus3-invariant-space-bundle.tar.gz"
  - title: "n=72 char-zero triweight range"
    kind: "genus-3 reconstruction"
    note: "Exact reconstructed affine/basis data for the compatible n=72 triweight family."
    file: "downloads/genus3/exact_V.json.gz"
  - title: "Genus-3 theta projection  Z = Theta(W)"
    kind: "cft / lattice projection"
    note: "The genus-3 triweight projected onto its Siegel modular form -- the code-CFT / Narain-lattice partition function at central charge c=36. The theta map Theta: R_3 -> M_3 is surjective with kernel <j_8>."
    file: "downloads/cft/theta_split_verdict.json"
  - title: "Theta-visibility splitting"
    kind: "cft / lattice projection"
    note: "On the 5-dim triweight freedom the partition function has rank 1: Theta(v) = Theta(R_0) + sigma*Theta(F_1). The CFT/lattice side sees the freedom only through a single scalar sigma; 4 of the 5 directions are invisible."
    file: "downloads/cft/exact_split_verdict.json"
  - title: "j_8 kernel quotient  M_3 = R_3 / <j_8>"
    kind: "cft / lattice projection"
    note: "Exact polynomial certificate that ker Theta = <j_8>, with j_8 = enum3(e8(+)e8) - enum3(d16+) (degree 16, weight 8): the unique relation among the 8 genus-3 theta constants."
    file: "downloads/cft/symbolic_quotient_summary.json"
  - title: "Fourier-Jacobi boundary"
    kind: "cft / lattice projection"
    note: "Degeneration test: each Fourier-Jacobi coefficient phi_m(Theta(v)) is automatically a genus-2 Jacobi form of weight 18 / index m, so the CFT factorization and Fourier-Jacobi constraints are vacuous on the triweight freedom."
    file: "downloads/cft/fourier_jacobi_verdict.json"
